
name: Accounts REST API Evidence

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rest-api-demo.yaml"
  workflow_dispatch:

jobs:
  rest-api:
    name: Accounts REST API Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/accounts
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/accounts

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Accounts API CRUD requests
        shell: bash
        run: |
          set -euo pipefail

          BASE="http://127.0.0.1:8080"

          echo "Starting Accounts API..."

          gunicorn --bind 127.0.0.1:8080 service:app \
            > /tmp/accounts-server.log 2>&1 &

          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0

          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE/health" > /dev/null 2>&1; then
              READY=1
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Accounts API failed to start."
            cat /tmp/accounts-server.log
            exit 1
          fi

          echo "Accounts API started successfully."

          record_request() {
            local file="$1"
            local expected="$2"
            local display_command="$3"

            shift 3

            printf '%s\n\n' "$display_command" > "$file"

            local actual

            actual=$(curl -sS --max-time 20 \
              -D /tmp/response.headers \
              -o /tmp/response.body \
              -w '%{http_code}' "$@")

            cat /tmp/response.headers >> "$file"
            cat /tmp/response.body >> "$file"
            printf '\n' >> "$file"

            cat "$file"
            echo "Expected: $expected"
            echo "Actual: $actual"

            if [ "$actual" != "$expected" ]; then
              echo "ERROR: Unexpected HTTP response."
              cat /tmp/accounts-server.log
              return 1
            fi
          }

          CREATE_JSON='{"name":"Demo Account","email":"demo@example.com","address":"123 Sample Street","phone_number":"5550100","date_joined":"2026-10-22"}'

          echo "TASK 13 - CREATE"

          record_request \
            rest-create-done \
            201 \
            "curl -i -X POST $BASE/accounts -H 'Content-Type: application/json' -d '$CREATE_JSON'" \
            -X POST "$BASE/accounts" \
            -H "Content-Type: application/json" \
            -d "$CREATE_JSON"

          ACCOUNT_ID=$(python -c \
            'import json; print(json.load(open("/tmp/response.body"))["id"])')

          echo "Created account ID: $ACCOUNT_ID"

          echo "TASK 14 - LIST"

          record_request \
            rest-list-done \
            200 \
            "curl -i -X GET $BASE/accounts" \
            -X GET "$BASE/accounts"

          echo "TASK 15 - READ"

          record_request \
            rest-read-done \
            200 \
            "curl -i -X GET $BASE/accounts/$ACCOUNT_ID" \
            -X GET "$BASE/accounts/$ACCOUNT_ID"

          UPDATE_JSON='{"name":"Updated Account","email":"updated@example.com","address":"456 New Street","phone_number":"5550200","date_joined":"2026-10-22"}'

          echo "TASK 16 - UPDATE"

          record_request \
            rest-update-done \
            200 \
            "curl -i -X PUT $BASE/accounts/$ACCOUNT_ID -H 'Content-Type: application/json' -d '$UPDATE_JSON'" \
            -X PUT "$BASE/accounts/$ACCOUNT_ID" \
            -H "Content-Type: application/json" \
            -d "$UPDATE_JSON"

          echo "TASK 17 - DELETE"

          record_request \
            rest-delete-done \
            204 \
            "curl -i -X DELETE $BASE/accounts/$ACCOUNT_ID" \
            -X DELETE "$BASE/accounts/$ACCOUNT_ID"

          echo "TASK 26 - APPLICATION JSON OUTPUT"

          curl --fail-with-body --silent --show-error \
            --max-time 20 "$BASE/" | tee kube-app-output

          echo

          python -m json.tool kube-app-output > /dev/null

          echo "Application JSON captured successfully."
          echo "All five REST API requests passed."

      - name: Build Docker image and save details
        shell: bash
        run: |
          set -euo pipefail

          echo "TASK 30 - DOCKER IMAGE DETAILS"

          echo "Building accounts:latest Docker image..."

          docker build -t accounts:latest .

          echo "Docker image built successfully."

          docker image ls accounts:latest \
            --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}\t{{.Size}}' \
            | tee kube-images

          echo "Docker image information saved to kube-images."

      - name: Upload REST API and Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-api-evidence
          path: |
            rest-create-done
            rest-list-done
            rest-read-done
            rest-update-done
            rest-delete-done
            kube-app-output
            kube-images
          if-no-files-found: warn

      - name: Show server logs if failed
        if: failure()
        run: |
          cat /tmp/accounts-server.log || true
