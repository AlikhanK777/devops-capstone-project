
name: Customer Accounts CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/accounts
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/accounts

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 nose coverage flask-talisman

      - name: Lint code with Flake8
        run: |
          flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests with nosetests
        run: |
          nosetests -v
