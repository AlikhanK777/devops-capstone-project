            name: accounts-check-security
          spec:
            steps:
              - name: verify-headers
                image: python:3.9-slim
                script: |
                  #!/usr/bin/env python3
                  from urllib.request import Request, urlopen

                  origin = "http://localhost:3000"
                  url = "http://accounts.default.svc.cluster.local:8080/accounts"
                  request = Request(url, headers={"Origin": origin})
                  with urlopen(request, timeout=20) as response:
                      cors = response.headers.get("Access-Control-Allow-Origin")
                      frame = response.headers.get("X-Frame-Options")
                      print("GET /accounts HTTP", response.status, flush=True)
                      print("Request Origin:", origin, flush=True)
                      print("CORS:", cors, flush=True)
                      print("X-Frame-Options:", frame, flush=True)
                      assert response.status == 200
                      assert cors in ("*", origin), "Missing or unexpected CORS header: " + repr(cors)
                      assert frame, "Missing X-Frame-Options header"
                  print("PASS: CORS and security headers", flush=True)
          ---
          apiVersion: tekton.dev/v1
          kind: Pipeline
          metadata:
            name: accounts-validation
          spec:
            tasks:
              - name: health-and-json
                taskRef:
                  name: accounts-check-health
              - name: list-accounts
                runAfter:
                  - health-and-json
                taskRef:
                  name: accounts-check-list
              - name: security-headers
                runAfter:
                  - list-accounts
                taskRef:
                  name: accounts-check-security
          ---
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            name: accounts-validation-run
          spec:
            pipelineRef:
              name: accounts-validation
            timeouts:
              pipeline: "10m"
          TEKTON

      - name: Wait for completed Tekton PipelineRun
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            status=$(kubectl get pipelinerun accounts-validation-run \
              -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].status}')
            reason=$(kubectl get pipelinerun accounts-validation-run \
              -o jsonpath='{.status.conditions[?(@.type=="Succeeded")].reason}')
            echo "Tekton PipelineRun status: ${status:-Pending}; reason: ${reason:-Pending}"

            if [ "$status" = "True" ]; then
              kubectl get pipelineruns,taskruns
              echo "SUCCESS: all Tekton pipeline tasks completed."
              exit 0
            fi

            if [ "$status" = "False" ]; then
              kubectl get pipelineruns,taskruns
              echo "ERROR: Tekton PipelineRun failed. Review the saved TaskRun logs."
              exit 1
            fi

            sleep 5
          done

          echo "ERROR: PipelineRun did not complete during the polling window."
          kubectl get pipelineruns,taskruns
          exit 1

      - name: Collect complete Tekton logs
        if: always()
        shell: bash
        run: |
          {
            echo "TASK 32 - FULL TEKTON PIPELINERUN LOGS"
            echo "=== PIPELINERUN STATUS ==="
            kubectl get pipelinerun accounts-validation-run -o yaml || true
            echo
            echo "=== TASKRUNS ==="
            kubectl get taskruns -l tekton.dev/pipelineRun=accounts-validation-run -o wide || true
            echo
            echo "=== LOGS OF ALL TEKTON TASK PODS ==="
            for pod in $(kubectl get pods \
              -l tekton.dev/pipelineRun=accounts-validation-run \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo
              echo "=== POD: $pod ==="
              kubectl logs "$pod" --all-containers=true \
                --prefix=true --timestamps=true || true
            done
          } | tee pipelinerun.txt

      - name: Upload pipelinerun.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tekton-evidence
          path: pipelinerun.txt
          if-no-files-found: warn
