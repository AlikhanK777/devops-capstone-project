name: Accounts Tekton Pipeline Evidence

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tekton-evidence.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tekton:
    name: Run Tekton Pipeline in Kubernetes
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: capstone
          wait: 120s

      - name: Build and load Accounts Docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t accounts:capstone .
          kind load docker-image accounts:capstone --name capstone

      - name: Deploy PostgreSQL and Accounts API
        shell: bash
        run: |
          set -euo pipefail

          kubectl create deployment postgres --image=postgres:14
          kubectl set env deployment/postgres \
            POSTGRES_USER=postgres \
            POSTGRES_PASSWORD=postgres \
            POSTGRES_DB=accounts
          kubectl expose deployment postgres --name=postgres \
            --port=5432 --target-port=5432
          kubectl rollout status deployment/postgres --timeout=180s

          kubectl create deployment accounts \
            --image=accounts:capstone --port=8080
          kubectl set env deployment/accounts \
            DATABASE_URI=postgresql://postgres:postgres@postgres:5432/accounts \
            SQLALCHEMY_DATABASE_URI=postgresql://postgres:postgres@postgres:5432/accounts
          kubectl expose deployment accounts --name=accounts \
            --port=8080 --target-port=8080
          kubectl rollout status deployment/accounts --timeout=240s
          kubectl get deployments,pods,services

      - name: Install Tekton Pipelines v1.15 LTS
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f \
            https://infra.tekton.dev/tekton-releases/pipeline/previous/v1.15.0/release.yaml

          kubectl -n tekton-pipelines rollout status \
            deployment/tekton-pipelines-controller --timeout=300s
          kubectl -n tekton-pipelines rollout status \
            deployment/tekton-pipelines-webhook --timeout=300s
          kubectl get pods -n tekton-pipelines

      - name: Define and start real Tekton PipelineRun
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f - <<'TEKTON'
          apiVersion: tekton.dev/v1
          kind: Task
          metadata:
            name: accounts-check-health
          spec:
            steps:
              - name: verify-health-and-json
                image: python:3.9-slim
                script: |
                  #!/usr/bin/env python3
                  import json
                  from urllib.request import urlopen

                  base = "http://accounts.default.svc.cluster.local:8080"
                  for endpoint in ("/health", "/"):
                      with urlopen(base + endpoint, timeout=20) as response:
                          body = response.read().decode()
                          print("GET", endpoint, "HTTP", response.status, body, flush=True)
                          assert response.status == 200

                  with urlopen(base + "/", timeout=20) as response:
                      data = json.load(response)
                  assert data["name"] == "Account REST API Service", data
                  print("PASS: health and application JSON", flush=True)
          ---
          apiVersion: tekton.dev/v1
          kind: Task
          metadata:
            name: accounts-check-list
          spec:
            steps:
              - name: verify-list
                image: python:3.9-slim
                script: |
                  #!/usr/bin/env python3
                  import json
                  from urllib.request import urlopen

                  url = "http://accounts.default.svc.cluster.local:8080/accounts"
                  with urlopen(url, timeout=20) as response:
                      data = json.load(response)
                      print("GET /accounts HTTP", response.status, flush=True)
                      print("Response:", data, flush=True)
                      assert response.status == 200
                  assert isinstance(data, list), data
                  print("PASS: accounts LIST API", flush=True)
          ---
          apiVersion: tekton.dev/v1
          kind: Task
          metadata:
            name: accounts-check-security
          spec:
            steps:
              - name: verify-headers
                image: python:3.9-slim
                script: |
                  #!/usr/bin/env python3
                  from urllib.request import urlopen

                  url = "http://accounts.default.svc.cluster.local:8080/"
                  with urlopen(url, timeout=20) as response:
                      cors = response.headers.get("Access-Control-Allow-Origin")
                      frame = response.headers.get("X-Frame-Options")
                      print("CORS:", cors, flush=True)
                      print("X-Frame-Options:", frame, flush=True)
                      assert cors == "*", cors
                      assert frame, "Missing X-Frame-Options header"
                  print("PASS: CORS and security headers", flush=True)
          ---
          apiVersion: tekton.dev/v1
          kind: Pipeline
          metadata:
            name: accounts-validation
          spec:
            tasks:
              - name: health-and-json
                taskRef:
                  name: accounts-check-health
              - name: list-accounts
                runAfter:
                  - health-and-json
                taskRef:
                  name: accounts-check-list
              - name: security-headers
                runAfter:
                  - list-accounts
                taskRef:
                  name: accounts-check-security
          ---
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            name: accounts-validation-run
          spec:
            pipelineRef:
              name: accounts-validation
            timeouts:
              pipeline: "10m"
          TEKTON

      - name: Wait for completed Tekton PipelineRun
        shell: bash
        run: |
          set -euo pipefail
          kubectl wait pipelinerun/accounts-validation-run \
            --for=condition=Succeeded --timeout=600s
          kubectl get pipelineruns,taskruns

      - name: Collect complete Tekton logs
        if: always()
        shell: bash
        run: |
          {
            echo "TASK 32 - FULL TEKTON PIPELINERUN LOGS"
            echo "=== PIPELINERUN STATUS ==="
            kubectl get pipelinerun accounts-validation-run -o yaml || true
            echo
            echo "=== TASKRUNS ==="
            kubectl get taskruns -l tekton.dev/pipelineRun=accounts-validation-run -o wide || true
            echo
            echo "=== LOGS OF ALL TEKTON TASK PODS ==="
            for pod in $(kubectl get pods \
              -l tekton.dev/pipelineRun=accounts-validation-run \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo
              echo "=== POD: $pod ==="
              kubectl logs "$pod" --all-containers=true \
                --prefix=true --timestamps=true || true
            done
          } | tee pipelinerun.txt

      - name: Upload pipelinerun.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tekton-evidence
          path: pipelinerun.txt
          if-no-files-found: warn
